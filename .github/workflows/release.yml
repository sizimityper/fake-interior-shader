name: Release VPM Package

on:
  release:
    types:
      - published

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r .version Packages/com.sizimityper.fake-interior-shader/package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Create zip for VPM
        run: |
          cd Packages/com.sizimityper.fake-interior-shader
          zip -r ../../com.sizimityper.fake-interior-shader-${{ steps.version.outputs.version }}.zip .
      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: com.sizimityper.fake-interior-shader-${{ steps.version.outputs.version }}.zip
